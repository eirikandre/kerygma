[package]
name = "kerygma-app"
version.workspace = true
edition.workspace = true
description = "Skriv manus og vis presentasjoner"

[lib]
name = "kerygma_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kerygma-core = { path = "../crates/kerygma-core", features = ["specta"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tauri-plugin-opener = "2"
# Typene og kommandoene i `ui/src/bindings.ts` lages fra Rust. Specta er i beta, så versjonene er låst.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# PDF av slidene (`capture.rs`): `createPDF` i WKWebView. Samme versjoner som wry bruker.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "WKWebView", "WKPDFConfiguration"] }
