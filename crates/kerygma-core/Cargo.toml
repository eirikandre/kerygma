[package]
name = "kerygma-core"
version.workspace = true
edition.workspace = true
description = "Logikken i Kerygma: presentasjoner, bibelreferanser, bibeloppslag og Word-import"

[dependencies]
bibel-core = { path = "../bibel-core" }
regex = "1"
fancy-regex = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
comrak = { version = "0.56.0", default-features = false }
trash = "5.2.9"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
unicode-normalization = "0.1.25"
lopdf = { version = "0.45.0", default-features = false }
# Typene til grensesnittet (`ui/src/bindings.ts`), lages av `src-tauri`.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[build-dependencies]
# build.rs leser boknavnene fra oversettelsene i bibler/.
bibel-format = { path = "../bibel-format" }

[dev-dependencies]
regex = "1"
